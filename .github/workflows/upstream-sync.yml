# AMEEN: keeps Ameen up to date with upstream Cashew.
# Weekly (and on demand) it merges jameskokoska/Cashew main into a branch,
# re-applies Ameen's translation overrides, runs analyze + tests and opens a PR.
# When the merge conflicts, the PR is opened from upstream's main so the
# conflicts can be resolved (see AMEEN_CHANGES.md for every Ameen hook).
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/jameskokoska/Cashew.git
  UPSTREAM_BRANCH: main
  FLUTTER_VERSION: "3.19.6"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream"
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse --short upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.up_to_date == 'false'
        run: |
          BRANCH="upstream-sync/${{ steps.fetch.outputs.upstream_sha }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "$BRANCH"
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-apply Ameen translation overrides
        if: steps.merge.outputs.conflicts == 'false'
        run: |
          python3 budget/assets/translations/ameen-apply-overrides.py
          if ! git diff --quiet; then
            git commit -am "Re-apply Ameen translation overrides"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.merge.outputs.conflicts == 'false'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze and test
        id: checks
        if: steps.merge.outputs.conflicts == 'false'
        continue-on-error: true
        working-directory: budget
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Open pull request (clean merge)
        if: steps.merge.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"
          STATUS="passed"
          if [ "${{ steps.checks.outcome }}" != "success" ]; then STATUS="FAILED, see the workflow run"; fi
          gh pr create \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Merge upstream Cashew ${{ steps.fetch.outputs.upstream_sha }}" \
            --body "Automated merge of jameskokoska/Cashew \`${{ env.UPSTREAM_BRANCH }}\` (${{ steps.fetch.outputs.upstream_sha }}).

          - Merge: clean
          - flutter analyze / flutter test: $STATUS
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the upstream changelog for new database migrations or settings before merging."

      - name: Open pull request (conflicts)
        if: steps.merge.outputs.conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B "${{ steps.merge.outputs.branch }}" "upstream/$UPSTREAM_BRANCH"
          git push origin "${{ steps.merge.outputs.branch }}"
          gh pr create \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Merge upstream Cashew ${{ steps.fetch.outputs.upstream_sha }} (has conflicts)" \
            --body "Upstream Cashew could not be merged automatically.

          Resolve locally:
          \`\`\`
          git fetch origin && git checkout main
          git merge origin/${{ steps.merge.outputs.branch }}
          # keep upstream's code, re-apply the // AMEEN lines (see AMEEN_CHANGES.md)
          python budget/assets/translations/ameen-apply-overrides.py
          \`\`\`"
