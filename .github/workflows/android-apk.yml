# AMEEN: builds installable APKs. Download them from the run's "Artifacts".
# Signed with the Ameen upload key when the repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are set (alias
# "upload"); otherwise with the debug key, which can't update a signed install.
name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [ameen-dev]

env:
  FLUTTER_VERSION: "3.19.6"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Use the Ameen upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload.jks"
          } > android/key.properties
      - name: Build APKs (one per CPU, smaller downloads)
        # AMEEN: every CI build gets a higher version code than the last (and
        # than upstream's), so phones and App Tester see it as an update
        run: flutter build apk --release --split-per-abi --build-number=$((3000000 + ${{ github.run_number }}))
      - uses: actions/upload-artifact@v4
        with:
          name: ameen-apk-${{ github.sha }}
          path: budget/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      # AMEEN: send the arm64 APK (most phones) to testers in Firebase App
      # Distribution, who get it as an update in the Firebase App Tester app.
      # Needs the repository secret FIREBASE_SERVICE_ACCOUNT_JSON and a tester
      # group with the alias "testers"; skipped until the secret is set.
      - name: Send to testers (Firebase App Distribution)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          git log -1 --pretty=%B | head -c 15000 > "$RUNNER_TEMP/notes.txt"
          npx --yes firebase-tools@13 appdistribution:distribute             build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             --app 1:574981835110:android:6ab14e7cf967bb6d4d60a7             --groups testers             --release-notes-file "$RUNNER_TEMP/notes.txt"
          rm -f "$RUNNER_TEMP/firebase-sa.json"
