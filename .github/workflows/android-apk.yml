# AMEEN: builds installable APKs. Download them from the run's "Artifacts".
# Signed with the Ameen upload key when the repository secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are set (alias
# "upload"); otherwise with the debug key, which can't update a signed install.
name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [ameen-dev]

env:
  FLUTTER_VERSION: "3.19.6"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Use the Ameen upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload.jks"
          } > android/key.properties
      - name: Build APKs (one per CPU, smaller downloads)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: ameen-apk-${{ github.sha }}
          path: budget/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
