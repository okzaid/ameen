# AMEEN: publishes the marketing site in /site to GitHub Pages
# (https://ameen.zaidshaikh.com). Runs when the site changes.
name: Marketing site

on:
  workflow_dispatch:
  push:
    branches: [ameen-dev, main]
    paths: ["site/**", ".github/workflows/site-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
